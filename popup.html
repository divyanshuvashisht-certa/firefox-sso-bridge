<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Certa Containers</title><link rel="stylesheet" href="popup.css"></head>
<body><main>
  <header><span class="mark">C</span><div><h1>Certa Containers</h1><p>Separate client sessions, shared Google sign-in.</p></div></header>
  <form id="create" autocomplete="off"><label for="name">Client name</label><div class="create-row"><input id="name" maxlength="80" placeholder="Pepsi" required autofocus><input id="color" type="hidden" value="blue"><div class="palette" role="group" aria-label="Container color"><button class="color-swatch blue selected" type="button" data-color="blue" aria-label="Blue" aria-pressed="true"></button><button class="color-swatch turquoise" type="button" data-color="turquoise" aria-label="Turquoise" aria-pressed="false"></button><button class="color-swatch green" type="button" data-color="green" aria-label="Green" aria-pressed="false"></button><button class="color-swatch yellow" type="button" data-color="yellow" aria-label="Yellow" aria-pressed="false"></button><button class="color-swatch orange" type="button" data-color="orange" aria-label="Orange" aria-pressed="false"></button><button class="color-swatch red" type="button" data-color="red" aria-label="Red" aria-pressed="false"></button><button class="color-swatch pink" type="button" data-color="pink" aria-label="Pink" aria-pressed="false"></button><button class="color-swatch purple" type="button" data-color="purple" aria-label="Purple" aria-pressed="false"></button><button class="color-swatch toolbar" type="button" data-color="toolbar" aria-label="Gray" aria-pressed="false"></button></div></div><button class="primary" type="submit">Create container</button></form>
  <p id="error" role="alert"></p><section aria-labelledby="your-containers"><h2 id="your-containers">Your containers</h2><ul id="containers"></ul></section>
</main><script src="popup.js"></script></body></html>
